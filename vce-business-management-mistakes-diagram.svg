<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img" aria-labelledby="bm-title bm-desc">
<title id="bm-title">Four steps to a stronger VCE Business Management response</title>
<desc id="bm-desc">Identify the command word, select evidence from the given case study, explain the consequence, and connect to the business objective.</desc>
<rect width="680" height="200" rx="14" fill="#EFF6FF"/>
<rect x="0" y="0" width="6" height="200" rx="3" fill="#6366F1"/>
<text x="340" y="36" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#0F1E3D" text-anchor="middle">Build an applied Business Management answer</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1E3A8A" font-weight="700" text-anchor="middle">
<rect x="18" y="65" width="142" height="95" rx="10" fill="white" stroke="#6366F1" stroke-width="1.5"/>
<text x="89" y="104">1. Command word</text><text x="89" y="125" font-size="12" font-weight="400">What is asked?</text>
<rect x="185" y="65" width="142" height="95" rx="10" fill="white" stroke="#6366F1" stroke-width="1.5"/>
<text x="256" y="104">2. Case evidence</text><text x="256" y="125" font-size="12" font-weight="400">Use the stimulus</text>
<rect x="352" y="65" width="142" height="95" rx="10" fill="white" stroke="#6366F1" stroke-width="1.5"/>
<text x="423" y="104">3. Explain effect</text><text x="423" y="125" font-size="12" font-weight="400">Cause → consequence</text>
<rect x="519" y="65" width="142" height="95" rx="10" fill="white" stroke="#6366F1" stroke-width="1.5"/>
<text x="590" y="104">4. Business goal</text><text x="590" y="125" font-size="12" font-weight="400">Link the outcome</text>
</g>
<g stroke="#6366F1" stroke-width="2.5" fill="none" stroke-linejoin="round"><path d="M164 111h17l-5 -5m5 5l-5 5"/><path d="M331 111h17l-5 -5m5 5l-5 5"/><path d="M498 111h17l-5 -5m5 5l-5 5"/></g>
</svg>
